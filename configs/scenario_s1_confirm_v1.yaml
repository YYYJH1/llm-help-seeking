# Confirmatory run configuration of the real scenario S1 (version scenario_s1_confirm_v1).
# Read by scripts/run_scenario_confirm.py (nmi/scenario/config.py, load_confirm_scenario_config). It is the configuration of the sealed confirmatory batch: the TriviaQA sealed
# pool (data/splits/s1_triviaqa_v1) is read once, through a registered batch, by the three phases expert, answer and decide.
# The md5 of this file goes into the manifest of every run and into the batch manifest, and a resumed run must have the same.
#
# Everything is the development configuration (configs/scenario_s1_v1.yaml) except four items: exploratory is false, a_pct is the fixed integer, the file has a confirmation_note in place of
# the development_reason, and the meta version says confirm. The development configuration still demands exploratory: true and refuses this file; the loader of this file refuses the development one.
#
# a_pct is the expert's accuracy on the DEVELOPMENT pool as an integer percent (0.643 on the 1,000 development items, rounded half up), stated in the three decide prompts. It is fixed: the expert
# result on the sealed pool does not change it (the expert summary of the sealed batch suggests no percent), and no phase of the confirmatory entry accepts a null.
#
# Models: the eight end-side models and the expert (Qwen3-32B-AWQ, no thinking, the phase expert only), the same entries as in the development configuration. family names the tool-call writing that the
# adapter's native sensitivity analysis reads (qwen3, qwen2.5, smollm3: <tool_call>; phi: <|tool_call|>; gemma: <|tool_call>; olmo: <function_calls>). chat_template_kwargs switch thinking off. tool_injection is
# optional: when given it must equal what the chat template calls for (Phi-4-mini reads message['tools'] of the system message, the others take tools=). llm_kwargs are keyword arguments of vllm.LLM that the models
# need (Qwen3-14B runs with quantization fp8 on the shared card). The memory fraction is a command-line argument, not part of this file.
# The expert asks the engine for per-request statistics (disable_log_stats: false) so that the expert table can carry the engine's service time of every item.

meta:
  version: scenario_s1_confirm_v1
  revision: R1
  design: "real scenario S1 (confirmatory configuration)"

task: triviaqa

data:
  split_dir: data/splits/s1_triviaqa_v1
  source: /path/to/hf_hub/datasets--mandarjoshi--trivia_qa/snapshots/0f7faf33a3908546c6fd5b73a660e0f8ff173c2f/rc.nocontext/validation-00000-of-00001.parquet

prompts: configs/prompts/scenario_s1.yaml

paths:
  results_root: results

a_pct: 64   # expert accuracy 0.643 on the 1,000 development items (development expert run, Qwen3-32B-AWQ), rounded half up

phases:
  expert_max_tokens: 32
  answer_max_tokens: 32
  follow_up_max_tokens: 1
  decide_max_tokens: 96
  unit_items: 250

backend:
  kind: vllm_offline
  dtype: bfloat16
  seed: 0

models:
  expert:
    id: qwen3-32b-awq
    path: /path/to/models/qwen3-32b-awq
    family: qwen3
    chat_template_kwargs: {enable_thinking: false}
    llm_kwargs: {disable_log_stats: false}   # the engine then keeps per-request statistics: the expert table gets service_s (the service time of every item)
  devices:
    - {id: qwen3-1.7b, path: /path/to/models/qwen3-1.7b, family: qwen3, chat_template_kwargs: {enable_thinking: false}}
    - {id: qwen3-4b, path: /path/to/models/qwen3-4b, family: qwen3, chat_template_kwargs: {enable_thinking: false}}
    - {id: qwen3-14b, path: /path/to/models/qwen3-14b, family: qwen3, chat_template_kwargs: {enable_thinking: false}, llm_kwargs: {quantization: fp8}}
    - {id: qwen2.5-7b-instruct, path: /path/to/models/qwen2.5-7b-instruct-fresh, family: qwen2.5, chat_template_kwargs: {enable_thinking: false}}
    - {id: gemma-4-e4b-it, path: /path/to/hf_hub/models--google--gemma-4-E4B-it/snapshots/ee0ef6023621cff504d758262d4e04895a5af4a2, family: gemma, chat_template_kwargs: {enable_thinking: false}}
    - {id: olmo-3-7b-instruct, path: /path/to/hf_hub/models--allenai--Olmo-3-7B-Instruct/snapshots/6e5971d9eba42665f5bd5a0fcf047f299ce1dccc, family: olmo, chat_template_kwargs: {enable_thinking: false}}
    - {id: phi-4-mini-instruct, path: /path/to/hf_hub/models--microsoft--Phi-4-mini-instruct/snapshots/cfbefacb99257ffa30c83adab238a50856ac3083, family: phi, chat_template_kwargs: {enable_thinking: false}, tool_injection: system_field}
    - {id: smollm3-3b, path: /path/to/hf_hub/models--HuggingFaceTB--SmolLM3-3B/snapshots/a07cc9a04f16550a088caea529712d1d335b0ac1, family: smollm3, chat_template_kwargs: {enable_thinking: false}}

exploratory: false
confirmation_note: "confirmatory batch v2_s1_01 of the real scenario S1: the TriviaQA sealed pool of 2,000 items is read once through a registered batch; the calibration fit, the three confidence gates and the expert percent are the frozen values of the development pool, and nothing is refitted on the sealed pool"
